<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    Tomato Leaf Doctor mark: a serrated tomato leaflet inside a viewfinder
    reticle. The reticle ties the brand to the camera framing overlay; the
    leaflet is the subject. Single weight, one colour, legible at 48px.
    The right half of the leaf is the left half mirrored, so the outline
    stays symmetric by construction.
  -->
  <g stroke="#A94F2C" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- viewfinder corner brackets -->
    <path d="M104 40 L68 40 Q40 40 40 68 L40 104" />
    <path d="M408 40 L444 40 Q472 40 472 68 L472 104" />
    <path d="M104 472 L68 472 Q40 472 40 444 L40 408" />
    <path d="M408 472 L444 472 Q472 472 472 444 L472 408" />
    <!-- serrated leaflet, left half -->
    <path
      id="leaf-half"
      d="M256 380 C230 372 196 356 178 330 L192 322 C176 302 168 282 170 262 L186 258 C172 236 170 216 178 198 L194 200 C186 180 196 156 216 146 L222 158 C232 144 246 130 256 122"
    />
    <!-- right half: mirror of the left -->
    <use href="#leaf-half" transform="translate(512 0) scale(-1 1)" />
    <!-- stem -->
    <path d="M256 380 L256 414" />
    <!-- midrib -->
    <path d="M256 356 L256 168" stroke-width="20" />
  </g>
</svg>
